<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - DecoHogar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="barra-principal">
    <div class="logo-tienda">
      <h1>DecoHogar</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
    <div class="cart-container">
      <a href="carrito.html">🛒 Cart (0)</a>
    </div>
  </div>
</header>

<main>
  <section class="seccion-registro">
    <div class="barra-registro">
      <h2>Registro de usuario</h2>
    </div>
    <form>
      <article>
        <p>
          <label>NOMBRE COMPLETO:</label>
          <input type="text" maxlength="100" required>
        </p>
        <p>
          <label>CORREO ELECTRONICO:</label>
          <input type="email" required>
        </p>
        <p>
          <label>CONTRASEÑA:</label>
          <input type="password" required>
        </p>
        <p>
          <label>CONFIRMAR CONTRASEÑA:</label>
          <input type="password" required>
        </p>
        <p>
          <label>TELEFONO (opcional):</label>
          <input type="number">
        </p>
      </article>

      <!-- CONTENEDOR DONDE SE INSERTARÁN LAS DIRECCIONES -->
      <div id="lista-direcciones">
        <!-- Primera dirección -->
        <div class="tarjeta-direccion">
          <article>
            <p>
              <label>ALIAS:</label>
              <input type="text" name="alias_type[]" maxlength="20" placeholder="Ej: Casa, Trabajo" required>
            </p>
            <p>
              <label>DIRECCIÓN:</label>
              <input type="text" name="direccion_type[]" minlength="10" required>
            </p>
          </article>

          <article class="contenedor-filas">
            <div class="fila-region">
              <select name="region_type[]" class="select-region" required>
                <option value="" disabled selected>-- Seleccione la región --</option>
                <option value="metropolitana">Región Metropolitana de Santiago</option>
                <option value="araucania">Región de La Araucanía</option>
                <option value="nuble">Región de Ñuble</option>
              </select>
            </div>

            <div class="fila-comuna">
              <select name="comuna_type[]" class="select-comuna" disabled required>
                <option value="" disabled selected>-- Seleccione una región primero --</option>
              </select>
            </div>
          </article>
        </div>
      </div>

      <div>
        <button type="button" id="btn-agregar-dir" onclick="agregarDireccion()" class="btn btn-secondary btn-block">+ Agregar Dirección</button>
        <span id="err-direcciones" class="mensaje-error"></span>
      </div>

      <div class="form-group">
        <label>Estilos de preferencia (Elige al menos 1):</label>
        <div class="checkbox-grid">
          <label class="checkbox-item"><input type="checkbox" name="estilo" value="Minimalista"> Minimalista</label>
          <label class="checkbox-item"><input type="checkbox" name="estilo" value="Industrial"> Industrial</label>
          <label class="checkbox-item"><input type="checkbox" name="estilo" value="Nórdico"> Nórdico</label>
          <label class="checkbox-item"><input type="checkbox" name="estilo" value="Vintage"> Vintage</label>
          <label class="checkbox-item"><input type="checkbox" name="estilo" value="Rustico"> Rústico</label>
          <label class="checkbox-item"><input type="checkbox" name="estilo" value="Moderno"> Moderno</label>
        </div>
        <span id="err-estilos" class="mensaje-error"></span>
      </div>
      <br>
      <button type="submit" class="btn-registrar">REGISTRAR</button>
    </form>
  </section>
</main>

<footer>
  <p>&copy; 2026 Tienda DecoHogar. Todos los derechos reservados.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
