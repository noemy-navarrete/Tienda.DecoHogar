<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras - DecoHogar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="barra-principal">
    <div class="logo-tienda">
      <h1>DecoHogar</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
    <div class="cart-container">
      <a href="carrito.html">🛒 Cart (<span id="cart-count">0</span>)</a>
    </div>
  </div>
</header>

<main class="form-container cart-page-container">
  <h2>Tu Carrito de Compras</h2>

  <div id="cart-items-container">
    <p>Tu carrito está vacío.</p>
  </div>

  <div class="cart-summary">
    <h3>Total: <span id="cart-total">$0</span></h3>
    <div class="cart-actions">
      <button class="btn-producto btn-vaciar" id="btn-vaciar">Vaciar Carrito</button>
      <button class="btn-producto" onclick="alert('¡Compra realizada con éxito!')">Finalizar Compra</button>
    </div>
  </div>
</main>

</html>
