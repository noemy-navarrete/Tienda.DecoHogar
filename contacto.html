    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>

    <div class="cart-container">

</header>
    <seccion class="barra-usuario-inferior">
      <div class="user-actions">
        <a href="login.html">Iniciar sesión</a> |
        <a href="registro.html">Registrarse</a>
      </div>
    </seccion>
    <seccion  class="logo-nombre">
      <img src="img/logo.jpg" alt="Logo" class="img-logo">
      <div class="nombre">
        <h1>DecoHogar</h1>
      </div>
    </seccion>

<main class="form-container">
  <h2>Contáctanos</h2>
  <p>¿Tienes dudas con tu pedido o algún producto? Escríbenos y te responderemos a la brevedad.</p>

  <form id="contact-form">
    <div class="form-group">
      <label for="nombre-contacto">Nombre:</label>
      <input type="text" id="nombre-contacto" name="nombre" required>
    </div>
    <div class="form-group">
      <label for="email-contacto">Correo electrónico:</label>
      <input type="email" id="email-contacto" name="email" required placeholder="tu.correo@ejemplo.com">
    </div>
    <div class="form-group">
      <label for="asunto">Asunto:</label>
      <input type="text" id="asunto" name="asunto" required>
    </div>
    <div class="form-group">
      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
    </div>
    <button type="submit" class="btn">Enviar Mensaje</button>
  </form>
</main>

<footer>

<script src="script.js"></script>
</body>
